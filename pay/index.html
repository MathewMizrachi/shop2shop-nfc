<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop2Shop Pay</title>
    <script>
        // Redirect to the Shop2Shop app via custom URL scheme
        (function() {
            var params = window.location.search;
            var appUrl = "shop2shoppay://pay" + params;

            // Try to open the app
            window.location.href = appUrl;

            // If the app didn't open after 2 seconds, show fallback
            setTimeout(function() {
                document.getElementById('fallback').style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }, 2000);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A2645;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container { max-width: 480px; text-align: center; }
        .logo { font-size: 1.75rem; font-weight: 700; margin-bottom: 2rem; }
        .logo span { color: #D8893D; }
        #loading { margin-top: 2rem; }
        .spinner {
            width: 40px; height: 40px; margin: 0 auto 1rem;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #D8893D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #fallback { display: none; }
        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2rem;
        }
        h2 { color: #D8893D; font-size: 1.2rem; margin-bottom: 1rem; }
        p { font-size: 0.95rem; line-height: 1.6; color: rgba(255,255,255,0.75); margin-bottom: 1rem; }
        .btn {
            display: inline-block;
            background: #D8893D;
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Shop<span>2</span>Shop</div>

        <div id="loading">
            <div class="spinner"></div>
            <p>Opening Shop2Shop Pay...</p>
        </div>

        <div id="fallback">
            <div class="card">
                <h2>App Not Installed</h2>
                <p>The Shop2Shop Pay app isn't installed on this device. Install it to make NFC payments.</p>
                <a href="#" class="btn" id="retryBtn">Try Again</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('retryBtn').addEventListener('click', function(e) {
            e.preventDefault();
            var params = window.location.search;
            window.location.href = "shop2shoppay://pay" + params;
        });
    </script>
</body>
</html>
